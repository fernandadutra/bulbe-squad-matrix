<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulbe — Resultado da simulação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="screen">
    <bulbe-header-desktop active-tab="consumo"></bulbe-header-desktop>
    <bulbe-header></bulbe-header>

    <bulbe-banner></bulbe-banner>

    <bulbe-sheet tipo="resultado">
      <h1 class="title title--compact">
        Sua <span class="title--accent">simulação</span>
      </h1>

      <bulbe-metric-card
        label="Você vai economizar por mês"
        value="52,50"
        data-result="monthlySavings"
      ></bulbe-metric-card>

      <h2 class="section-title">Comparativo mensal</h2>

      <div class="compare">
        <article class="compare__card compare__card--bad">
          <h3 class="compare__head">Sem desconto</h3>
          <p class="compare__sub">Você paga</p>
          <p class="compare__value">R$ <span data-result="fullPrice">350,00</span></p>
          <p class="compare__tag"><span aria-hidden="true">✗</span> Tarifa cheia</p>
        </article>

        <span class="compare__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </span>

        <article class="compare__card compare__card--good">
          <h3 class="compare__head">Com Bulbe</h3>
          <p class="compare__sub">Você paga</p>
          <p class="compare__value">R$ <span data-result="bulbePrice">297,50</span></p>
          <p class="compare__tag"><span aria-hidden="true">✓</span> até 15% desconto</p>
        </article>
      </div>

      <bulbe-metric-card
        label="Sua economia anual estimada"
        value="630,00"
        data-result="annualSavings"
      ></bulbe-metric-card>
      <div class="footer-result__container">
        <button type="button" class="btn btn--success" id="ctaStart">
          Comece agora <span aria-hidden="true">→</span>
        </button>
        <a href="simular-desconto.html" class="btn btn--ghost">
          <span aria-hidden="true" class="txt--ghost">←</span> Simular novamente
        </a>
      </div>
    </bulbe-sheet>

    <bulbe-footer active-tab="consumo"></bulbe-footer>
  </div>

  <script src="components.js"></script>
  <script src="script.js"></script>
</body>

</html>
