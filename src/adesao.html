<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulbe — Adesão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="screen">
    <bulbe-header-desktop active-tab="consumo"></bulbe-header-desktop>
    <bulbe-header></bulbe-header>

    <bulbe-banner></bulbe-banner>

    <bulbe-sheet tipo="placeholder">

      <div class="placeholder__icone" aria-hidden="true">📋</div>

      <h1 class="placeholder__titulo">Fluxo de Adesão</h1>

      <p class="placeholder__descricao">
        Aqui entra o fluxo completo de adesão ao serviço Bulbe.
      </p>

      <div class="placeholder__fluxo" aria-label="Etapas do fluxo de adesão">
        <div class="placeholder__etapa">
          <span class="placeholder__num">1</span>
          <span>Adesão :: Contato — nome, e-mail e WhatsApp</span>
        </div>
        <div class="placeholder__etapa">
          <span class="placeholder__num">2</span>
          <span>Adesão :: Negócio — dados da conta de luz</span>
        </div>
        <div class="placeholder__etapa">
          <span class="placeholder__num">3</span>
          <span>Adesão :: Termos — política de privacidade e termo de adesão</span>
        </div>
        <div class="placeholder__etapa">
          <span class="placeholder__num">4</span>
          <span>Confirmação — compartilhamento e senha de acesso</span>
        </div>
      </div>

      <a href="resultado.html" class="btn btn--ghost pre-grafico__btn">← Voltar</a>

    </bulbe-sheet>
  </div>

  <script src="components.js"></script>
</body>

</html>
