<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulbe — Simular desconto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="screen">
    <bulbe-header-desktop active-tab="consumo"></bulbe-header-desktop>
    <bulbe-header></bulbe-header>

    <bulbe-banner></bulbe-banner>

    <bulbe-sheet>
      <div class="sheet__head">
        <h1 class="title">
          Veja quanto você<br />
          pode <span class="title--accent">economizar</span><br />
          na sua conta de luz
        </h1>
        <button class="icon-btn title__help" aria-label="Como funciona a simulação">
          <img src="../public/tooltip.png" alt="Como funciona a simulação"
            style="width: 26px; height: 26px; object-fit: contain;" />
        </button>
      </div>

      <p class="lead">Insira o valor da sua última fatura e simule o desconto com a Bulbe.</p>

      <bulbe-fatura-card></bulbe-fatura-card>

      <button form="simulador" type="submit" class="btn btn--primary">
        Simular <span aria-hidden="true">→</span>
      </button>

    </bulbe-sheet>

    <bulbe-footer active-tab="consumo"></bulbe-footer>
  </div>

  <script src="components.js"></script>
  <script src="script.js"></script>
</body>

</html>
